<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="glass-panel">
    <!-- Header -->
    <header>
      <h1>🔐 SPM</h1>
      <button id="logout-btn" class="hidden">Lock</button>
    </header>

    <!-- Error/Message Container -->
    <div id="message-box" class="hidden"></div>

    <!-- Locked / Not-logged-in View -->
    <section id="view-locked" class="hidden">
      <div class="locked-state">
        <div class="lock-icon">🔒</div>
        <p class="lock-msg">Your vault is locked.</p>
        <p class="lock-sub">Use your key file to unlock.</p>
        <button id="open-auth-btn">Open Login / Register</button>
      </div>
    </section>

    <!-- Main Vault View -->
    <section id="view-vault" class="hidden">
      <!-- Search -->
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Regex search (e.g., .*google.*)" autocomplete="off">
      </div>

      <!-- Add Entry Form (Toggleable) -->
      <div class="add-entry-container">
        <button id="toggle-add-btn">⬇ Add New Entry</button>
        <form id="add-entry-form" class="hidden glass-panel">
          <input type="text" id="entry-site" placeholder="Website" required autocomplete="off">
          <input type="text" id="entry-user" placeholder="Username" required autocomplete="off">
          <input type="password" id="entry-pass" placeholder="Password" required autocomplete="off">
          <button type="submit" id="save-btn">Save Entry</button>
        </form>
      </div>

      <!-- List of Entries -->
      <ul id="entries-list"></ul>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
